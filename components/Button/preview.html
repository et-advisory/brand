<!-- @dsCard group="Actions" height=580 subtitle="ETA.Button: seven variants at 32, 40 and 48px" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Button preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
#root{padding:var(--space-5)}
.stack{display:flex;flex-direction:column;gap:var(--space-5)}
.group{display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.lbl{font-family:var(--font-mono);font-size:12px;font-weight:500;line-height:1.4;color:var(--ink-muted)}
.band{background:var(--band-dark);padding:var(--space-4);border-radius:var(--radius-lg)}
.band .lbl{color:var(--on-band-dark-muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4)}
</style></head>
<body>
<div id="root"></div>
<script>
var E = window.ETA, h = React.createElement;
function G(label, child, cls) { return h("div", { className: "group" }, h("span", { className: "lbl" }, label), h("div", { className: cls || "row" }, child)); }

var sizes = [32, 40, 48];
function set(variant, label) { return sizes.map(function (s) { return h(E.Button, { key: s, variant: variant, size: s }, label); }); }
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "stack" },
  G("primary", set("primary", "Talk with our team")),
  G("secondary", set("secondary", "See how we work")),
  G("outline", set("outline", "Meet the team")),
  G("ghost", set("ghost", "Continue")),
  G("link", h(E.Button, { variant: "link", href: "#" }, "Learn more")),
  G("inverse", set("inverse", "Get started")),
  G("onDark, on band-dark", h("div", { className: "band row" }, set("onDark", "See how we work")))
));
</script>
</body></html>
