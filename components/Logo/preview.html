<!-- @dsCard group="Brand" height=1200 subtitle="ETA.Logo: the Ruby, Sapphire and Emerald tetrahedron mark, lockups and tones, drawn from tokens" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Logo — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
#root{padding:var(--space-5)}
.stack{display:flex;flex-direction:column;gap:var(--space-5)}
.group{display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.lbl{font-family:var(--font-mono);font-size:12px;font-weight:500;line-height:1.4;color:var(--ink-muted)}
.band{background:var(--band-dark);padding:var(--space-4);border-radius:var(--radius-lg)}
.band .lbl{color:var(--on-band-dark-muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4)}
.h{margin:0;font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-strong)}
.grid{display:grid;gap:var(--space-4)}.g3{grid-template-columns:1.6fr 1fr 1fr}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:1fr 1fr}
.tile{display:flex;flex-direction:column;gap:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-5);background:var(--card);min-height:190px}
.tile .art{flex:1;display:flex;align-items:center;justify-content:center}
.tband{background:var(--band-dark);border-color:var(--band-dark)}.tband .lbl{color:var(--on-band-dark-muted)}
.taccent{background:var(--accent);border-color:var(--accent)}.taccent .lbl{color:var(--on-accent)}
.x{font-size:12px;font-weight:600;color:var(--danger)}
.cs{display:inline-block;padding:28px;border:1px dashed var(--accent-strong)}
.minrow{display:flex;align-items:flex-end;gap:var(--space-5);flex-wrap:wrap}.minrow>div{display:flex;flex-direction:column;gap:var(--space-2)}
.rgb path{fill:var(--gold)!important}</style></head>
<body>
<div id="root"></div>
<script>
var E = window.ETA, h = React.createElement;
function G(label, child, cls) { return h("div", { className: "group" }, h("span", { className: "lbl" }, label), h("div", { className: cls || "row" }, child)); }

function Tile(p) { return h("div", { className: "tile" + (p.band ? " tband" : "") + (p.accent ? " taccent" : "") }, h("div", { className: "art" }, p.children), h("span", { className: "lbl" }, p.label), p.x ? h("span", { className: "x" }, p.x) : null); }
function L(p) { return h(E.Logo, p); }
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "stack" },
  h("p", { className: "h" }, "Variants"),
  h("div", { className: "grid g3" },
    h(Tile, { label: 'variant="horizontal"' }, L({ width: 300 })),
    h(Tile, { label: 'variant="stacked"' }, L({ variant: "stacked", width: 118 })),
    h(Tile, { label: 'variant="mark"' }, L({ variant: "mark", width: 96 }))),
  h("p", { className: "h" }, "Tones"),
  h("div", { className: "grid g4" },
    h(Tile, { band: true, label: 'tone="reversed" on band-dark' }, L({ tone: "reversed", width: 180 })),
    h(Tile, { label: 'tone="mono"' }, L({ tone: "mono", width: 180 })),
    h(Tile, { accent: true, label: 'tone="onAccent"' }, L({ tone: "onAccent", width: 180 })),
    h(Tile, { band: true, label: 'tone="gold", band-dark only' }, L({ variant: "mark", tone: "gold", width: 72 }))),
  h("p", { className: "h" }, "Clear space and minimum size"),
  h("div", { className: "grid g2" },
    h(Tile, { label: "x = one third of the mark's height, on every side" }, h("span", { className: "cs" }, L({ width: 250 }))),
    h(Tile, { label: "Below 160px wide, use the mark alone" }, h("div", { className: "minrow" },
      h("div", null, L({ width: 160 }), h("span", { className: "lbl" }, "Lockup 160px")),
      h("div", null, L({ variant: "stacked", width: 72 }), h("span", { className: "lbl" }, "Stacked 72px")),
      h("div", null, L({ variant: "mark", width: 24 }), h("span", { className: "lbl" }, "Mark 24px")),
      h("div", null, L({ variant: "mark", tone: "mono", width: 16 }), h("span", { className: "lbl" }, "16px, mono"))))),
  h("p", { className: "h" }, "Do not"),
  h("div", { className: "grid g4" },
    h(Tile, { label: "Not with other palette hues, not gold", x: "Recolour the faces" }, L({ variant: "mark", width: 70, className: "rgb" })),
    h(Tile, { label: "The apex always points up", x: "Rotate or flip" }, L({ variant: "mark", width: 70, style: { transform: "rotate(180deg)" } })),
    h(Tile, { label: "Scale proportionally", x: "Stretch or squash" }, L({ variant: "mark", width: 110, preserveAspectRatio: "none", style: { height: 60 } })),
    h(Tile, { label: "No shadows, outlines or gradients", x: "Add effects" }, L({ variant: "mark", width: 70, style: { filter: "drop-shadow(4px 6px 0 var(--ink-faint))" } })))
));
</script>
</body></html>
