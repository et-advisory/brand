<!doctype html>
<html><head><meta charset="utf-8"><title>Card — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
#root{padding:var(--space-5)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
h3{margin:0;font-size:24px;font-weight:700;line-height:1.2}
p{margin:0;color:var(--ink-muted)}
</style></head>
<body>
<div id="root"></div>
<script>
var E = window.ETA, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "row" },
  h(E.Card, { footer: "Source: Paxos, paxos.com/paxg" },
    h("h3", null, "Gold, PAXG"),
    h("p", null, "One token represents one fine troy ounce of gold in a London vault.")),
  h(E.Card, { footer: h("span", null, "Sources: ", h("a", { href: "https://app.rwa.xyz/treasuries" }, "app.rwa.xyz/treasuries"), " · ", h("a", { href: "https://stellar.org/case-studies/franklin-templeton" }, "stellar.org")) },
    h("h3", null, "Fund shares, FOBXX"),
    h("p", null, "The public blockchain has been the fund's official share register since April 2021."))
));
</script>
</body></html>
