<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{margin:0;background:var(--paper)}
.cover{position:relative;width:960px;height:336px;background:var(--paper);overflow:hidden;font-family:var(--font-sans)}
.cover svg{position:absolute;left:0;top:0}
.blk{rx:var(--radius-lg)}
.b-deep{fill:var(--mark-facet-deep)}.b-accent{fill:var(--accent)}.b-light{fill:var(--mark-facet-light)}.b-band{fill:var(--ink-band)}.b-tint{fill:var(--accent-tint)}
.t-up{fill:var(--mark-facet-light)}.t-dn{fill:var(--accent-tint)}
.f1{fill:var(--mark-reversed-light)}.f2{fill:var(--mark-reversed-mid)}.f3{fill:var(--mark-reversed-deep)}
.name{position:absolute;left:var(--space-6);bottom:var(--space-6);width:440px}
.name h1{margin:0;font-size:88px;font-weight:800;line-height:.95;letter-spacing:-0.03em;color:var(--ink)}
.name p{margin:var(--space-3) 0 0;font-size:13px;line-height:1.4;color:var(--ink-muted)}</style></head><body><div class="cover">
<svg width="960" height="336" viewBox="0 0 960 336" aria-hidden="true">
<!-- Derivation
blocks: ink-band 288x240 slab with the mark inside it, mark-facet-deep 192x144, accent 96x144, mark-facet-light 96x96, accent-tint 240x96 on a 48px (space-7) unit; corners radius-lg.
arrangement: one tall slab with satellites, flush from x = 480 and bleeding off the top edge; the three facet blues step from deep to light the way the mark is lit.
pattern: a two-row strip of 48px triangles (18 units) alternating mark-facet-light and accent-tint, because the README's mark is a faceted tetrahedron; a literal motif built from its silhouette.
steps and radii: 48px unit (space-7), 48px triangle side, radius-lg block corners; name 88px (Advisory fits 440px at 0.6em), tagline 13px, inset space-6.
-->
<defs><clipPath id="slab"><rect x="672" y="0" width="288" height="240" rx="8"/></clipPath></defs>
<rect class="blk b-deep" x="480" y="0" width="192" height="144"/>
<rect class="blk b-accent" x="480" y="144" width="96" height="96"/>
<rect class="blk b-light" x="576" y="144" width="96" height="96"/>

<g clip-path="url(#slab)"><g transform="translate(726 34) scale(1.75)"><path d="M57.91 3.62 L2.57 99.47 L64.83 62.19Z" style="fill:var(--mark-reversed-light)"/><path d="M116.72 98.24 L63.16 5.48 L69.86 62.16Z" style="fill:var(--mark-reversed-mid)"/><path d="M4.87 103.92 L115.9 103.92 L67.32 66.52Z" style="fill:var(--mark-reversed-deep)"/></g></g>

<rect class="blk b-tint" x="720" y="240" width="240" height="96"/>
</svg>
