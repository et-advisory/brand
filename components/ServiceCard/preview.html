<!-- @dsCard group="Marketing" height=270 subtitle="ETA.ServiceRow: always exactly three ServiceCards, numbered 01 to 03" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../lib/react.production.min.js"></script><script src="../lib/react-dom.production.min.js"></script><script src="../bundle.js"></script><title>ServiceCard — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
#root{padding:var(--space-5)}
.stack{display:flex;flex-direction:column;gap:var(--space-5)}
.group{display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.lbl{font-family:var(--font-mono);font-size:12px;font-weight:500;line-height:1.4;color:var(--ink-muted)}
.band{background:var(--band-dark);padding:var(--space-4);border-radius:var(--radius-lg)}
.band .lbl{color:var(--on-band-dark-muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4)}
</style></head>
<body>
<div id="root"></div>
<script>
var E = window.ETA, h = React.createElement;
function G(label, child, cls) { return h("div", { className: "group" }, h("span", { className: "lbl" }, label), h("div", { className: cls || "row" }, child)); }

ReactDOM.createRoot(document.getElementById("root")).render(h(E.ServiceRow, null));
</script>
</body></html>
